[project]
name = "docagentx-backend"
version = "0.1.0"
description = "Agentic Document Intelligence RAG backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "pymupdf>=1.27.2.3",
    "fastembed>=0.8.0",
    "numpy>=2.4.6",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
